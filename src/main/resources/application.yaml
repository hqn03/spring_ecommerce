spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/auth_service?rewriteBatchedStatements=true
    username: root
    password: mysql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  data:
    web:
      pageable:
        serialization-mode: via_dto
    redis:
      host: localhost
      port: 6379

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  success-url: http://localhost:8080/api/v1/payments/success
  cancel-url: http://localhost:8080/api/v1/payments/cancel